
  server:
    port: ${PORT:9099}

  spring:
    application:
      name: cinebook

    profiles:
      active: ${SPRING_PROFILES_ACTIVE:local}

    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 5MB

  jwt:
    secret: ${JWT_SECRET:cinebook-development-secret-key-minimum-256-bit-length}

  springdoc:
    swagger-ui:
      path: /swagger-ui.html

  logging:
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

