
  spring:

    datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update

      show-sql: false

      properties:
        hibernate:
          format_sql: false

      open-in-view: false

    data:
      redis:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT:6379}

  logging:
    level:
      root: INFO
      com.cinebook: INFO
      org.springframework.security: WARN

