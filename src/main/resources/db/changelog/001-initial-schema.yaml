
  databaseChangeLog:

    - changeSet:
        id: 1
        author: ajeet

        changes:

          - createTable:
              tableName: roles

              columns:
                - column:
                    name: id
                    type: BIGSERIAL

                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: name
                    type: VARCHAR(255)

                    constraints:
                      unique: true
                      nullable: false

